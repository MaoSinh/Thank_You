<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Thank You</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia, "Times New Roman", serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.025),
            transparent 55%
        );
}

.message{
    position:fixed;
    top:50%;
    left:50%;

    width:90%;
    max-width:900px;

    text-align:center;
    color:white;

    transform:
        translate3d(
            calc(-50% + var(--x)),
            calc(-50% + var(--y)),
            0
        );

    transition:transform .7s cubic-bezier(.22,1,.36,1);

    pointer-events:none;
    will-change:transform;
}

.message h1{
    font-size:clamp(25px,5vw,58px);
    font-weight:400;
    line-height:1.35;
    letter-spacing:1.5px;

    opacity:0;

    animation:
        textIn 2.2s cubic-bezier(.22,1,.36,1)
        forwards;

    text-shadow:
        0 0 10px rgba(255,255,255,.45),
        0 0 35px rgba(130,180,255,.18);
}

.message p{
    margin-top:25px;

    font-family:Arial,sans-serif;
    font-size:clamp(12px,2vw,18px);

    letter-spacing:4px;
    color:rgba(255,255,255,.55);

    opacity:0;

    animation:
        textIn 2s cubic-bezier(.22,1,.36,1)
        .7s forwards;
}

@keyframes textIn{
    from{
        opacity:0;
        transform:translateY(35px);
        filter:blur(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}

.hint{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);

    color:rgba(255,255,255,.28);
    font:10px Arial,sans-serif;
    letter-spacing:3px;

    opacity:0;

    animation:
        hintIn 3s ease 3s forwards;
}

@keyframes hintIn{
    to{
        opacity:1;
    }
}

@media(max-width:600px){

    .message{
        width:88%;
    }

    .message h1{
        letter-spacing:.5px;
    }

    .message p{
        margin-top:18px;
        letter-spacing:2px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="overlay"></div>

<div class="message" id="message">

    <h1>
        Thank you for staying with me<br>
        until the very last note —
    </h1>

    <p>
        it means more than you know.
    </p>

</div>

<div class="hint">
    TOUCH · MOVE · EXPERIENCE
</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha:false
    });

const message =
    document.getElementById("message");

let W,H,DPR;

function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


// ==========================
// POINTER
// ==========================

let pointer = {
    x: W/2,
    y: H/2
};

let smoothPointer = {
    x: W/2,
    y: H/2
};

function movePointer(x,y){

    pointer.x = x;
    pointer.y = y;

    const px =
        (x-W/2)*0.025;

    const py =
        (y-H/2)*0.025;

    message.style.setProperty(
        "--x",
        px+"px"
    );

    message.style.setProperty(
        "--y",
        py+"px"
    );
}

window.addEventListener(
    "mousemove",
    e=>{
        movePointer(
            e.clientX,
            e.clientY
        );
    }
);

window.addEventListener(
    "touchmove",
    e=>{

        const t =
            e.touches[0];

        if(t){

            movePointer(
                t.clientX,
                t.clientY
            );
        }

    },
    {passive:true}
);


// ==========================
// COLORS
// ==========================

const COLORS = [

    "#ff4d6d",
    "#ff9f1c",
    "#ffe66d",
    "#4dffb8",
    "#4ddfff",
    "#5b7cff",
    "#b967ff",
    "#ff5bd7",
    "#ffffff"

];


// ==========================
// PARTICLES
// ==========================

const rockets = [];
const particles = [];


// ==========================
// ROCKET
// ==========================

class Rocket{

    constructor(x){

        this.x =
            x ??
            Math.random()*W;

        this.y =
            H+20;

        this.targetY =
            H*.12+
            Math.random()*H*.42;

        this.speed =
            4.5+
            Math.random()*1.8;

        this.color =
            COLORS[
                Math.floor(
                    Math.random()*
                    COLORS.length
                )
            ];

        this.trail=[];
    }

    update(){

        this.trail.push({
            x:this.x,
            y:this.y
        });

        if(
            this.trail.length>16
        ){
            this.trail.shift();
        }

        this.y -= this.speed;

        // subtle sideways movement
        this.x +=
            Math.sin(
                this.y*.025
            )*.18;

        if(
            this.y<=this.targetY
        ){

            explode(
                this.x,
                this.y,
                this.color
            );

            return true;
        }

        return false;
    }

    draw(){

        for(
            let i=0;
            i<this.trail.length;
            i++
        ){

            const p =
                this.trail[i];

            const alpha =
                i/
                this.trail.length;

            ctx.globalAlpha =
                alpha*.45;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                1.2,
                0,
                Math.PI*2
            );

            ctx.fillStyle =
                this.color;

            ctx.fill();
        }

        ctx.globalAlpha=1;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            2.5,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            this.color;

        ctx.shadowBlur=18;
        ctx.shadowColor=
            this.color;

        ctx.fill();

        ctx.shadowBlur=0;
    }
}


// ==========================
// EXPLOSION
// ==========================

function explode(
    x,
    y,
    color
){

    const amount =
        W<600
        ? 65
        : 100;

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const speed =
            .8+
            Math.pow(
                Math.random(),
                .45
            )*5.2;

        particles.push(
            new Particle(
                x,
                y,
                Math.cos(angle)*speed,
                Math.sin(angle)*speed,
                color
            )
        );
    }

    // small secondary sparkles

    for(
        let i=0;
        i<18;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        particles.push(
            new Particle(
                x,
                y,
                Math.cos(angle)*
                (4+Math.random()*3),

                Math.sin(angle)*
                (4+Math.random()*3),

                "#ffffff"
            )
        );
    }
}


// ==========================
// PARTICLE
// ==========================

class Particle{

    constructor(
        x,
        y,
        vx,
        vy,
        color
    ){

        this.x=x;
        this.y=y;

        this.vx=vx;
        this.vy=vy;

        this.color=color;

        this.life=1;

        this.size=
            .7+
            Math.random()*1.7;

        this.drag=
            .975+
            Math.random()*.01;

        this.gravity=
            .025+
            Math.random()*.025;

        this.decay=
            .006+
            Math.random()*.009;
    }

    update(){

        this.vx *= this.drag;
        this.vy *= this.drag;

        this.vy +=
            this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.life -=
            this.decay;

        return this.life<=0;
    }

    draw(){

        const alpha =
            Math.pow(
                this.life,
                1.5
            );

        ctx.globalAlpha =
            alpha;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            this.color;

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            this.color;

        ctx.fill();

        ctx.shadowBlur=0;
    }
}


// ==========================
// RANDOM FIREWORK
// ==========================

let lastLaunch=0;

function launch(){

    const now =
        performance.now();

    // adaptive launch rate
    const interval =
        W<600
        ? 900
        : 650;

    if(
        now-lastLaunch>
        interval
    ){

        lastLaunch=now;

        rockets.push(
            new Rocket()
        );

        // sometimes launch second
        if(
            Math.random()<.22
        ){

            setTimeout(
                ()=>{
                    rockets.push(
                        new Rocket()
                    );
                },
                180
            );
        }
    }
}


// ==========================
// CLICK / TOUCH
// ==========================

function userFirework(
    x,
    y
){

    const rocket =
        new Rocket(x);

    rocket.targetY =
        Math.max(
            80,
            Math.min(
                y,
                H*.75
            )
        );

    rockets.push(
        rocket
    );
}

window.addEventListener(
    "click",
    e=>{
        userFirework(
            e.clientX,
            e.clientY
        );
    }
);

window.addEventListener(
    "touchstart",
    e=>{

        const t =
            e.touches[0];

        if(t){

            userFirework(
                t.clientX,
                t.clientY
            );
        }

    },
    {passive:true}
);


// ==========================
// MAIN LOOP
// ==========================

let previous =
    performance.now();

function animate(time){

    requestAnimationFrame(
        animate
    );

    // Smooth pointer
    smoothPointer.x +=
        (
            pointer.x-
            smoothPointer.x
        )*.08;

    smoothPointer.y +=
        (
            pointer.y-
            smoothPointer.y
        )*.08;


    // Fade previous frame
    ctx.globalCompositeOperation =
        "source-over";

    ctx.fillStyle =
        "rgba(0,0,0,.16)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.globalCompositeOperation =
        "lighter";


    launch();


    // Rockets

    for(
        let i=rockets.length-1;
        i>=0;
        i--
    ){

        const dead =
            rockets[i].update();

        rockets[i].draw();

        if(dead){

            rockets.splice(i,1);

        }
    }


    // Particles

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const dead =
            particles[i].update();

        particles[i].draw();

        if(dead){

            particles.splice(i,1);

        }
    }


    ctx.globalAlpha=1;

    ctx.globalCompositeOperation =
        "source-over";
}


// Initial fireworks

setTimeout(
    ()=>{
        rockets.push(
            new Rocket(W*.25)
        );
    },
    500
);

setTimeout(
    ()=>{
        rockets.push(
            new Rocket(W*.7)
        );
    },
    1100
);

setTimeout(
    ()=>{
        rockets.push(
            new Rocket(W*.5)
        );
    },
    1700
);


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
